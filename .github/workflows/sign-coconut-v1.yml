name: Sign Coconut Chunks 1.0.0

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sign-coconut-v1.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  sign-validated-apk:
    name: Sign validated Coconut Chunks 1.0.0 APK
    runs-on: ubuntu-latest
    steps:
      - name: Download validated unsigned APK
        uses: actions/download-artifact@v4
        with:
          repository: vielleichtistdasso-arch/CoconutChunks
          run-id: 31241417242
          name: Coconut-Chunks-1.0.0-unsigned-release
          path: ${{ runner.temp }}/unsigned
          github-token: ${{ github.token }}

      - name: Prepare unsigned APK
        shell: bash
        run: |
          set -euo pipefail
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"
          unsigned_apk="$(find "$RUNNER_TEMP/unsigned" -type f -name '*.apk' -print -quit)"
          test -n "$unsigned_apk"
          cp "$unsigned_apk" "$RUNNER_TEMP/Coconut-Chunks-1.0.0-unsigned.apk"

      - name: Restore release signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.COCONUT_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          normalized_keystore_base64="$(printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]')"
          test -n "$normalized_keystore_base64"
          printf '%s' "$normalized_keystore_base64" | base64 --decode > "$RUNNER_TEMP/coconut-chunks-release.jks"
          test -s "$RUNNER_TEMP/coconut-chunks-release.jks"

      - name: Sign and verify release APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.COCONUT_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.COCONUT_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          unsigned_apk="$RUNNER_TEMP/Coconut-Chunks-1.0.0-unsigned.apk"
          signed_apk="$RUNNER_TEMP/Coconut-Chunks-1.0.0-release.apk"
          keystore="$RUNNER_TEMP/coconut-chunks-release.jks"

          test -x "$apksigner"
          test -s "$unsigned_apk"
          test -s "$keystore"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_PASSWORD"

          "$apksigner" sign \
            --ks "$keystore" \
            --ks-key-alias "coconut-chunks-release" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$signed_apk" \
            "$unsigned_apk"

          verify_output="$("$apksigner" verify --verbose --print-certs "$signed_apk")"
          printf '%s\n' "$verify_output"

          actual_fingerprint="$(printf '%s\n' "$verify_output" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1 | tr '[:upper:]' '[:lower:]' | tr -d ':')"
          expected_fingerprint="cbd52863ae9f22a1f1cb6dc846220d66462dff0c0a8ddb6d76bd416ebd37997c"

          if [[ "$actual_fingerprint" != "$expected_fingerprint" ]]; then
            echo "Release certificate fingerprint mismatch." >&2
            exit 1
          fi

      - name: Remove temporary signing key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/coconut-chunks-release.jks"

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: Coconut-Chunks-1.0.0-release
          path: ${{ runner.temp }}/Coconut-Chunks-1.0.0-release.apk
          if-no-files-found: error
          retention-days: 30
